run_id: {{RUN_ID}}
run_root: {{OUTPUT_DIR}}
working_directory: {{FIXTURE_ROOT}}
command_prefix: cd {{REPO_ROOT}} && uv run --frozen pde-agent

current_state: TASK_PARSED

allowed_actions:
  - read_run_state
  - read_bootstrap_prompt
  - read_task_spec
  - execute_deeponet_candidate_dryrun
  - evaluate_deeponet_candidate
  - build_deeponet_evidence_sweep
  - convert_operator_evidence_summary
  - record_strategy_proposal
  - build_strategy_rubric
  - evaluate_strategy_promotion
  - append_strategy_ledger

forbidden_actions:
  - patch_code
  - patch_input_data
  - implicit_download
  - guess_missing_paths
  - skip_required_reads
  - search_outside_current_directory
  - inspect_command_help
  - probe_command_surface
  - manually_inspect_generated_artifacts
  - call_build_submission
  - call_evaluate_strategy_promotion_before_convert_operator_evidence_summary

required_reads:
  - {{FIXTURE_ROOT}}/run_state.yaml
  - {{FIXTURE_ROOT}}/bootstrap_prompt.md
  - {{FIXTURE_ROOT}}/task_spec.json

required_artifacts:
  - {{OUTPUT_DIR}}/candidate/candidate_execution_report.json
  - {{OUTPUT_DIR}}/candidate/candidate_prediction.npz
  - {{OUTPUT_DIR}}/evaluation/candidate_evaluation_report.json
  - {{OUTPUT_DIR}}/deeponet_evidence/evidence_summary.json
  - {{OUTPUT_DIR}}/deeponet_evidence/evidence_summary.csv
  - {{OUTPUT_DIR}}/strategy_evidence_summary.json
  - {{OUTPUT_DIR}}/strategy_proposal.json
  - {{OUTPUT_DIR}}/experiment_rubric.json
  - {{OUTPUT_DIR}}/promotion_report.json
  - {{OUTPUT_DIR}}/strategy_ledger.jsonl

allowed_commands:
  - name: execute_deeponet_candidate_dryrun
    command: cd {{REPO_ROOT}} && uv run --frozen pde-agent execute-deeponet-candidate-dryrun --windows-path {{WINDOWS_PATH}} --output-dir {{OUTPUT_DIR}}/candidate --start-index 0 --train-steps 1 --training-strategy branch_trunk_rollout --force
  - name: evaluate_deeponet_candidate
    command: cd {{REPO_ROOT}} && uv run --frozen pde-agent evaluate-deeponet-candidate --candidate-report-path {{OUTPUT_DIR}}/candidate/candidate_execution_report.json --target-path {{WINDOWS_PATH}} --output-dir {{OUTPUT_DIR}}/evaluation --baseline-score-path {{BASELINE_SCORE_PATH}} --nu 0.001 --dt 1.0 --dx 1.0 --force
  - name: build_deeponet_evidence_sweep
    command: cd {{REPO_ROOT}} && uv run --frozen pde-agent build-deeponet-evidence-sweep --evaluation-report-path {{OUTPUT_DIR}}/evaluation/candidate_evaluation_report.json --output-dir {{OUTPUT_DIR}}/deeponet_evidence --force
  - name: convert_operator_evidence_summary
    command: cd {{REPO_ROOT}} && uv run --frozen pde-agent convert-operator-evidence-summary --sweep-summary-path {{OUTPUT_DIR}}/deeponet_evidence/evidence_summary.json --output-path {{OUTPUT_DIR}}/strategy_evidence_summary.json --model-family DeepONet --source-state-hint DEEPONET_EVIDENCE_SWEEP_COMPLETED --long-window-threshold 3 --force
  - name: record_strategy_proposal
    command: cd {{REPO_ROOT}} && uv run --frozen pde-agent record-strategy-proposal --strategy-id deeponet_dryrun_loop_v0 --title "DeepONet dryrun loop gate" --source-type local_library --problem-context "1D Burgers DeepONet dryrun loop protocol validation" --hypothesis "DeepONet candidate reports should pass through evaluation and evidence gates before strategy promotion." --mechanism "Use dryrun candidate predictions only to verify protocol wiring and evidence contracts." --implementation-plan-json "{\"model_family\":\"DeepONet\",\"mode\":\"dryrun\",\"allowed_commands\":[\"execute-deeponet-candidate-dryrun\",\"evaluate-deeponet-candidate\",\"build-deeponet-evidence-sweep\",\"convert-operator-evidence-summary\"]}" --expected-observable "candidate evaluation report is evidence-sweep compatible" --known-risk "dryrun candidate quality is not scientific evidence" --output-path {{OUTPUT_DIR}}/strategy_proposal.json
  - name: build_strategy_rubric
    command: cd {{REPO_ROOT}} && uv run --frozen pde-agent build-strategy-rubric --proposal-path {{OUTPUT_DIR}}/strategy_proposal.json --output-path {{OUTPUT_DIR}}/experiment_rubric.json --min-evaluation-windows 2 --max-inference-time-regression 0.10
  - name: evaluate_strategy_promotion
    command: cd {{REPO_ROOT}} && uv run --frozen pde-agent evaluate-strategy-promotion --proposal-path {{OUTPUT_DIR}}/strategy_proposal.json --rubric-path {{OUTPUT_DIR}}/experiment_rubric.json --evidence-summary-path {{OUTPUT_DIR}}/strategy_evidence_summary.json --output-path {{OUTPUT_DIR}}/promotion_report.json
  - name: append_strategy_ledger
    command: cd {{REPO_ROOT}} && uv run --frozen pde-agent append-strategy-ledger --proposal-path {{OUTPUT_DIR}}/strategy_proposal.json --rubric-path {{OUTPUT_DIR}}/experiment_rubric.json --evidence-summary-path {{OUTPUT_DIR}}/strategy_evidence_summary.json --promotion-report-path {{OUTPUT_DIR}}/promotion_report.json --ledger-path {{OUTPUT_DIR}}/strategy_ledger.jsonl

success_transition:
  on_complete: STRATEGY_LEDGER_APPENDED
