run_id: hermes_hypothesis_lab_infrastructure_001
run_root: {run_root}
working_directory: {fixture_root}
command_prefix: cd {repo_root} && uv run --frozen pde-agent

current_state: TASK_PARSED

allowed_actions:
  - read_run_state
  - read_bootstrap_prompt
  - read_task_spec
  - call_infrastructure_audit

forbidden_actions:
  - patch_code
  - implicit_download
  - guess_missing_paths
  - skip_required_reads
  - search_outside_current_directory
  - inspect_command_help
  - probe_command_surface
  - call_hypothesis_lab_runtime_directly
  - call_hermes_heartbeat_directly
  - call_runtime_audit_chain_directly

required_reads:
  - {fixture_root}/run_state.yaml
  - {fixture_root}/bootstrap_prompt.md
  - {fixture_root}/task_spec.json

required_artifacts:
  - {run_root}/hypothesis_lab_infrastructure_audit.json

allowed_commands:
  - name: audit_hypothesis_lab_infrastructure
    command: cd {repo_root} && uv run --frozen pde-agent audit-hermes-hypothesis-lab-infrastructure --acceptance-smoke-path {fixture_root}/fixtures/acceptance_smoke.json --preflight-chain-report-path {fixture_root}/fixtures/preflight_chain_report.json --runbook-path {repo_root}/docs/hermes_hypothesis_lab_runbook.md --output-path {run_root}/hypothesis_lab_infrastructure_audit.json --min-completed-iterations 2 --force

success_transition:
  on_complete: HERMES_HYPOTHESIS_LAB_INFRASTRUCTURE_AUDITED
