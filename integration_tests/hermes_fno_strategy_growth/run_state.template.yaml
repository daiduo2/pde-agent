run_id: {{RUN_ID}}
run_root: {{OUTPUT_DIR}}
working_directory: {{FIXTURE_ROOT}}
command_prefix: cd {{REPO_ROOT}} && uv run --frozen pde-agent

current_state: TASK_PARSED

allowed_actions:
  - read_run_state
  - read_bootstrap_prompt
  - read_task_spec
  - convert_fno_evidence_summary
  - recommend_strategy_next_action
  - record_strategy_proposal
  - build_strategy_rubric
  - evaluate_strategy_promotion
  - append_strategy_ledger

forbidden_actions:
  - patch_code
  - implicit_download
  - guess_missing_paths
  - skip_required_reads
  - search_outside_current_directory
  - inspect_command_help
  - probe_command_surface
  - manually_inspect_generated_artifacts
  - call_execute_fno_finetune_candidate_directly
  - call_evaluate_fno_candidate_directly
  - call_compare_fno_candidates_directly
  - call_build_submission
  - call_evaluate_strategy_promotion_before_recommend_strategy_next_action
  - call_evaluate_strategy_promotion_before_convert_fno_evidence_summary

required_reads:
  - {{FIXTURE_ROOT}}/run_state.yaml
  - {{FIXTURE_ROOT}}/bootstrap_prompt.md
  - {{FIXTURE_ROOT}}/task_spec.json

required_artifacts:
  - {{OUTPUT_DIR}}/strategy_evidence_summary.json
  - {{OUTPUT_DIR}}/strategy_decision.json
  - {{OUTPUT_DIR}}/strategy_proposal.json
  - {{OUTPUT_DIR}}/experiment_rubric.json
  - {{OUTPUT_DIR}}/promotion_report.json
  - {{OUTPUT_DIR}}/strategy_ledger.jsonl

allowed_commands:
  - name: convert_fno_evidence_summary
    command: cd {{REPO_ROOT}} && uv run --frozen pde-agent convert-fno-evidence-summary --sweep-summary-path {{FNO_SWEEP_SUMMARY_PATH}} --output-path {{OUTPUT_DIR}}/strategy_evidence_summary.json --long-window-threshold {{LONG_WINDOW_THRESHOLD}} --force
  - name: recommend_strategy_next_action
    command: cd {{REPO_ROOT}} && uv run --frozen pde-agent recommend-strategy-next-action --evidence-summary-path {{OUTPUT_DIR}}/strategy_evidence_summary.json --output-path {{OUTPUT_DIR}}/strategy_decision.json --min-evaluation-windows 3
  - name: record_strategy_proposal
    command: cd {{REPO_ROOT}} && uv run --frozen pde-agent record-strategy-proposal --strategy-id fno_scheduled_sampling_evidence_v0 --title "FNO scheduled sampling evidence gate" --source-type local_library --problem-context "1D Burgers FNO evidence sweep strategy-growth gate" --hypothesis "Scheduled sampling rollout fine-tuning should only be promoted when multi-window evidence is stable." --mechanism "Use FNO evidence sweep winners as quantitative evidence before skill promotion." --implementation-plan-json "{\"model_family\":\"FNO\",\"allowed_commands\":[\"run-fno-evidence-sweep\",\"convert-fno-evidence-summary\"],\"expected_artifacts\":[\"strategy_evidence_summary.json\"]}" --expected-observable "positive mean score delta across multiple windows" --expected-observable "non-negative long-window score delta" --known-risk "single-window improvement may not generalize" --known-risk "physics residual evidence may be neutral until measured directly" --output-path {{OUTPUT_DIR}}/strategy_proposal.json
  - name: build_strategy_rubric
    command: cd {{REPO_ROOT}} && uv run --frozen pde-agent build-strategy-rubric --proposal-path {{OUTPUT_DIR}}/strategy_proposal.json --output-path {{OUTPUT_DIR}}/experiment_rubric.json --min-evaluation-windows 3 --max-inference-time-regression 0.10
  - name: evaluate_strategy_promotion
    command: cd {{REPO_ROOT}} && uv run --frozen pde-agent evaluate-strategy-promotion --proposal-path {{OUTPUT_DIR}}/strategy_proposal.json --rubric-path {{OUTPUT_DIR}}/experiment_rubric.json --evidence-summary-path {{OUTPUT_DIR}}/strategy_evidence_summary.json --output-path {{OUTPUT_DIR}}/promotion_report.json
  - name: append_strategy_ledger
    command: cd {{REPO_ROOT}} && uv run --frozen pde-agent append-strategy-ledger --proposal-path {{OUTPUT_DIR}}/strategy_proposal.json --rubric-path {{OUTPUT_DIR}}/experiment_rubric.json --evidence-summary-path {{OUTPUT_DIR}}/strategy_evidence_summary.json --promotion-report-path {{OUTPUT_DIR}}/promotion_report.json --ledger-path {{OUTPUT_DIR}}/strategy_ledger.jsonl

success_transition:
  on_complete: STRATEGY_LEDGER_APPENDED
