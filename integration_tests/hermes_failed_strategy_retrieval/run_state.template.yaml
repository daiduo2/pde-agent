run_id: {{RUN_ID}}
run_root: {{OUTPUT_DIR}}
working_directory: {{FIXTURE_ROOT}}
command_prefix: cd {{REPO_ROOT}} && uv run --frozen pde-agent

current_state: TASK_PARSED

allowed_actions:
  - read_run_state
  - read_bootstrap_prompt
  - read_task_spec
  - recommend_strategy_next_action
  - formalize_external_strategy_candidate
  - record_strategy_proposal
  - build_strategy_rubric
  - evaluate_strategy_promotion
  - append_strategy_ledger
  - create_skill_candidate

forbidden_actions:
  - patch_code
  - patch_input_data
  - implicit_download
  - guess_missing_paths
  - skip_required_reads
  - search_outside_current_directory
  - inspect_command_help
  - probe_command_surface
  - manually_inspect_generated_artifacts
  - call_build_submission
  - call_training_commands

required_reads:
  - {{FIXTURE_ROOT}}/run_state.yaml
  - {{FIXTURE_ROOT}}/bootstrap_prompt.md
  - {{FIXTURE_ROOT}}/task_spec.json

required_artifacts:
  - {{OUTPUT_DIR}}/failed_strategy_evidence_summary.json
  - {{OUTPUT_DIR}}/strategy_decision.json
  - {{OUTPUT_DIR}}/retrieved_strategy_candidate.json
  - {{OUTPUT_DIR}}/strategy_proposal.json
  - {{OUTPUT_DIR}}/strategy_evidence_summary.json
  - {{OUTPUT_DIR}}/experiment_rubric.json
  - {{OUTPUT_DIR}}/promotion_report.json
  - {{OUTPUT_DIR}}/strategy_ledger.jsonl
  - {{OUTPUT_DIR}}/skill_candidate.json

allowed_commands:
  - name: recommend_strategy_next_action
    command: cd {{REPO_ROOT}} && uv run --frozen pde-agent recommend-strategy-next-action --evidence-summary-path {{FAILED_EVIDENCE_PATH}} --output-path {{OUTPUT_DIR}}/strategy_decision.json --min-evaluation-windows 3
  - name: formalize_external_strategy_candidate
    command: cd {{REPO_ROOT}} && uv run --frozen pde-agent formalize-external-strategy-candidate --strategy-decision-path {{OUTPUT_DIR}}/strategy_decision.json --output-path {{OUTPUT_DIR}}/retrieved_strategy_candidate.json --strategy-id burgers_spectral_viscosity_retrieved_v0 --title "Spectral viscosity stabilization for failed Burgers rollout" --source-title "Local retrieval seed: spectral viscosity stabilization" --source-url local://strategy-library/spectral-viscosity --scientific-claim "Adding a controlled high-frequency viscosity penalty can damp unstable Burgers rollout modes when local branch-trunk strategies regress." --mechanism "Introduce a spectral-viscosity loss or filter that targets high-wavenumber residual energy during rollout-oriented training." --applicable-pde "1D viscous Burgers" --targeted-failure-mode long_horizon_drift --targeted-failure-mode high_frequency_instability --implementation-plan-json "{\"model_family\":\"DeepONet\",\"source\":\"external_retrieval\",\"intervention\":\"spectral_viscosity_loss\",\"allowed_commands\":[\"run-deeponet-strategy-sweep\",\"convert-operator-evidence-summary\"],\"expected_artifacts\":[\"strategy_evidence_summary.json\"]}" --expected-observable "late-window RMSE decreases versus failed local strategy" --expected-observable "high-frequency residual energy decreases" --known-risk "spectral viscosity may over-smooth shock-like gradients"
  - name: record_strategy_proposal
    command: cd {{REPO_ROOT}} && uv run --frozen pde-agent record-strategy-proposal --strategy-id burgers_spectral_viscosity_retrieved_v0 --title "Spectral viscosity stabilization for failed Burgers rollout" --source-type external_retrieval --problem-context "DeepONet strategy retrieval triggered by negative_mean_score_delta, negative_long_window_score_delta, high_failure_rate after local best strategy supervised_h8" --hypothesis "Adding a controlled high-frequency viscosity penalty can damp unstable Burgers rollout modes when local branch-trunk strategies regress." --mechanism "Introduce a spectral-viscosity loss or filter that targets high-wavenumber residual energy during rollout-oriented training." --implementation-plan-json "{\"model_family\":\"DeepONet\",\"source\":\"external_retrieval\",\"intervention\":\"spectral_viscosity_loss\",\"allowed_commands\":[\"run-deeponet-strategy-sweep\",\"convert-operator-evidence-summary\"],\"expected_artifacts\":[\"strategy_evidence_summary.json\"]}" --expected-observable "late-window RMSE decreases versus failed local strategy" --expected-observable "high-frequency residual energy decreases" --known-risk "spectral viscosity may over-smooth shock-like gradients" --output-path {{OUTPUT_DIR}}/strategy_proposal.json
  - name: build_strategy_rubric
    command: cd {{REPO_ROOT}} && uv run --frozen pde-agent build-strategy-rubric --proposal-path {{OUTPUT_DIR}}/strategy_proposal.json --output-path {{OUTPUT_DIR}}/experiment_rubric.json --min-evaluation-windows 3 --max-inference-time-regression 0.10
  - name: evaluate_strategy_promotion
    command: cd {{REPO_ROOT}} && uv run --frozen pde-agent evaluate-strategy-promotion --proposal-path {{OUTPUT_DIR}}/strategy_proposal.json --rubric-path {{OUTPUT_DIR}}/experiment_rubric.json --evidence-summary-path {{PROMOTED_EVIDENCE_PATH}} --output-path {{OUTPUT_DIR}}/promotion_report.json
  - name: append_strategy_ledger
    command: cd {{REPO_ROOT}} && uv run --frozen pde-agent append-strategy-ledger --proposal-path {{OUTPUT_DIR}}/strategy_proposal.json --rubric-path {{OUTPUT_DIR}}/experiment_rubric.json --evidence-summary-path {{PROMOTED_EVIDENCE_PATH}} --promotion-report-path {{OUTPUT_DIR}}/promotion_report.json --ledger-path {{OUTPUT_DIR}}/strategy_ledger.jsonl
  - name: create_skill_candidate
    command: cd {{REPO_ROOT}} && uv run --frozen pde-agent create-skill-candidate --proposal-path {{OUTPUT_DIR}}/strategy_proposal.json --rubric-path {{OUTPUT_DIR}}/experiment_rubric.json --evidence-summary-path {{PROMOTED_EVIDENCE_PATH}} --promotion-report-path {{OUTPUT_DIR}}/promotion_report.json --output-path {{OUTPUT_DIR}}/skill_candidate.json --skill-name pde-deeponet-spectral-viscosity --skill-dir skills/pde-deeponet-spectral-viscosity

success_transition:
  on_complete: SKILL_CANDIDATE_CREATED
