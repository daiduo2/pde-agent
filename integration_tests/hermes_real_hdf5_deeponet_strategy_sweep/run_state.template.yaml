run_id: {{RUN_ID}}
run_root: {{OUTPUT_DIR}}
working_directory: {{FIXTURE_ROOT}}
command_prefix: cd {{REPO_ROOT}} && uv run --frozen pde-agent

current_state: TASK_PARSED

allowed_actions:
  - read_run_state
  - read_bootstrap_prompt
  - read_task_spec
  - run_real_hdf5_baseline_smoke
  - run_deeponet_strategy_sweep
  - convert_operator_evidence_summary
  - recommend_strategy_next_action
  - formalize_external_strategy_candidate
  - record_strategy_proposal

forbidden_actions:
  - patch_code
  - patch_input_data
  - implicit_download
  - guess_missing_paths
  - skip_required_reads
  - search_outside_current_directory
  - inspect_command_help
  - probe_command_surface
  - manually_inspect_generated_artifacts
  - cleanup_artifacts
  - move_artifacts
  - retry_failed_command_with_unlisted_command
  - call_build_submission
  - call_evaluate_strategy_promotion
  - call_append_strategy_ledger

required_reads:
  - {{FIXTURE_ROOT}}/run_state.yaml
  - {{FIXTURE_ROOT}}/bootstrap_prompt.md
  - {{FIXTURE_ROOT}}/task_spec.json

required_artifacts:
  - {{OUTPUT_DIR}}/baseline/real_hdf5_baseline_smoke_summary.json
  - {{OUTPUT_DIR}}/baseline/windows_f{{FORECAST_STEPS_PADDED}}.npz
  - {{OUTPUT_DIR}}/baseline/persistence_score.json
  - {{OUTPUT_DIR}}/strategy_sweep/deeponet_strategy_sweep_summary.json
  - {{OUTPUT_DIR}}/strategy_sweep/deeponet_strategy_sweep_summary.csv
  - {{OUTPUT_DIR}}/strategy_sweep/deeponet_evidence/evidence_summary.json
  - {{OUTPUT_DIR}}/strategy_sweep/deeponet_evidence/evidence_summary.csv
  - {{OUTPUT_DIR}}/strategy_evidence_summary.json
  - {{OUTPUT_DIR}}/strategy_decision.json
  - {{OUTPUT_DIR}}/retrieved_strategy_candidate.json
  - {{OUTPUT_DIR}}/strategy_proposal.json

allowed_commands:
  - name: run_real_hdf5_baseline_smoke
    command: cd {{REPO_ROOT}} && uv run --frozen pde-agent run-real-hdf5-baseline-smoke --source-path {{SOURCE_PATH}} --output-dir {{OUTPUT_DIR}}/baseline --dataset-key {{DATASET_KEY}} --start-index 0 --sample-limit {{SAMPLE_LIMIT}} --context-steps 10 --forecast-steps {{FORECAST_STEPS}} --time-reduction 5 --space-reduction 4 --nu 0.001 --dt 1 --dx 1 --force
  - name: run_deeponet_strategy_sweep
    command: cd {{REPO_ROOT}} && uv run --frozen pde-agent run-deeponet-strategy-sweep --windows-path {{OUTPUT_DIR}}/baseline/windows_f{{FORECAST_STEPS_PADDED}}.npz --output-dir {{OUTPUT_DIR}}/strategy_sweep --baseline-score-path {{OUTPUT_DIR}}/baseline/persistence_score.json --start-index 0 --start-index 1 --training-strategy branch_trunk_supervised --training-strategy branch_trunk_physics_residual --train-steps 2 --hidden-width 8 --latent-dim 4 --learning-rate 0.01 --seed 5 --spectral-weight 0.05 --physics-weight 0.005 --nu 0.001 --dt 1.0 --dx 1.0 --force
  - name: convert_operator_evidence_summary
    command: cd {{REPO_ROOT}} && uv run --frozen pde-agent convert-operator-evidence-summary --sweep-summary-path {{OUTPUT_DIR}}/strategy_sweep/deeponet_evidence/evidence_summary.json --output-path {{OUTPUT_DIR}}/strategy_evidence_summary.json --model-family DeepONet --source-state-hint DEEPONET_EVIDENCE_SWEEP_COMPLETED --long-window-threshold 31 --force
  - name: recommend_strategy_next_action
    command: cd {{REPO_ROOT}} && uv run --frozen pde-agent recommend-strategy-next-action --evidence-summary-path {{OUTPUT_DIR}}/strategy_evidence_summary.json --output-path {{OUTPUT_DIR}}/strategy_decision.json --min-evaluation-windows 2
  - name: formalize_external_strategy_candidate
    command: cd {{REPO_ROOT}} && uv run --frozen pde-agent formalize-external-strategy-candidate --strategy-decision-path {{OUTPUT_DIR}}/strategy_decision.json --output-path {{OUTPUT_DIR}}/retrieved_strategy_candidate.json --strategy-id burgers_spectral_viscosity_real_hdf5_v0 --title "Spectral viscosity stabilization for real-HDF5 DeepONet rollout" --source-title "Local retrieval seed: spectral viscosity stabilization" --source-url local://strategy-library/spectral-viscosity --scientific-claim "Adding controlled high-frequency viscosity can damp unstable Burgers DeepONet rollouts after real-data baseline comparison fails." --mechanism "Add a spectral-viscosity loss or filter targeting high-wavenumber residual energy during rollout-oriented DeepONet training." --applicable-pde "1D viscous Burgers" --targeted-failure-mode long_horizon_drift --targeted-failure-mode high_frequency_instability --implementation-plan-json "{\"model_family\":\"DeepONet\",\"source\":\"external_retrieval\",\"intervention\":\"spectral_viscosity_loss\",\"allowed_commands\":[\"run-deeponet-strategy-sweep\",\"convert-operator-evidence-summary\"],\"expected_artifacts\":[\"strategy_evidence_summary.json\"]}" --expected-observable "late-window RMSE decreases versus the failed real-HDF5 DeepONet sweep" --expected-observable "high-frequency residual energy decreases" --known-risk "spectral viscosity may over-smooth shock-like gradients"
  - name: record_strategy_proposal
    command: cd {{REPO_ROOT}} && uv run --frozen pde-agent record-strategy-proposal --strategy-id burgers_spectral_viscosity_real_hdf5_v0 --title "Spectral viscosity stabilization for real-HDF5 DeepONet rollout" --source-type external_retrieval --problem-context "DeepONet real-HDF5 strategy retrieval triggered by negative_mean_score_delta, negative_long_window_score_delta, high_failure_rate after supervised and physics-residual mini-sweeps failed against persistence." --hypothesis "Adding controlled high-frequency viscosity can damp unstable Burgers DeepONet rollouts after real-data baseline comparison fails." --mechanism "Add a spectral-viscosity loss or filter targeting high-wavenumber residual energy during rollout-oriented DeepONet training." --implementation-plan-json "{\"model_family\":\"DeepONet\",\"source\":\"external_retrieval\",\"intervention\":\"spectral_viscosity_loss\",\"allowed_commands\":[\"run-deeponet-strategy-sweep\",\"convert-operator-evidence-summary\"],\"expected_artifacts\":[\"strategy_evidence_summary.json\"]}" --expected-observable "late-window RMSE decreases versus the failed real-HDF5 DeepONet sweep" --expected-observable "high-frequency residual energy decreases" --known-risk "spectral viscosity may over-smooth shock-like gradients" --output-path {{OUTPUT_DIR}}/strategy_proposal.json

success_transition:
  on_complete: STRATEGY_PROPOSAL_RECORDED
